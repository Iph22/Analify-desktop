# Builds Analify for Windows and Mac and publishes the installers as a GitHub release.
# Runs when a version tag (v0.1.0, ...) is pushed, or by hand from the Actions tab.
# File names stay the same in every release, so https://github.com/<repo>/releases/latest/download/<file> always
# gives the newest: Analify-Setup.exe, Analify-mac-arm64.dmg, Analify-mac-x64.dmg.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: "--win", name: windows }
          # Each Mac build on its own machine: both disk images are called "Analify", and building them one
          # after the other on one machine makes the second collide with the first.
          - { os: macos-latest, target: "--mac --arm64", name: mac-arm64 }
          - { os: macos-latest, target: "--mac --x64", name: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund --foreground-scripts
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # no signing certificate yet (beta)
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Analify ${{ github.ref_name }} (beta)
          make_latest: "true"
          body: |
            Analify for Windows and Mac (beta).

            - **Windows 10 and 11:** Analify-Setup.exe. Windows may say it protected your PC because this beta isn't signed yet: choose More info → Run anyway.
            - **Mac with Apple silicon (M1 and later):** Analify-mac-arm64.dmg
            - **Intel Mac:** Analify-mac-x64.dmg

            On a Mac, the first time, macOS may say it can't check the app because this beta isn't notarised yet: open System Settings → Privacy & Security and choose Open Anyway.
          files: installers/*
